name: Build and Run Integration Tests

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates curl git build-essential gcc pkg-config libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2
        name: Cache Cargo

      - name: Start mock target
        run: |
          cargo run -p integration-tests -- mock-target &
          npx wait-on http://localhost:9090/health --timeout 60000

      - name: Start Proxy Entry
        run: |
          cargo run --package proxy-entry --bin proxy-entry -- --config tests/fixtures/config/proxy-entry-integration.toml &
          npx wait-on tcp:8080 -t 60000

      - name: Start test-only Agent harness
        run: |
          cargo run --package desktop-agent-be --features integration-test-harness \
            --bin desktop-agent-integration-harness -- \
            --config tests/fixtures/config/agent-integration.toml \
            --managed-proxy-address 127.0.0.1:8080 &
          npx wait-on tcp:7080 -t 60000

      - name: Integration Tests
        run: cargo run --package integration-tests --bin integration-tests -- integration --agent-addr 127.0.0.1:7080 --proxy-addr 127.0.0.1:8080
