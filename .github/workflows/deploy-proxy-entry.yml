name: Build and Deploy Proxy Entry

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select environment
        required: true
        type: choice
        options: [entry_production]
      instance_count:
        description: Number of Proxy Entry instances (ports 80, 81, 82, ...)
        required: false
        default: 1
        type: number

permissions:
  contents: read

concurrency:
  group: deploy-proxy-entry-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build Entry
        run: |
          set -euo pipefail
          bash -n deploy/proxy-entry/install.sh
          bash -n deploy/proxy-entry/instance-layout.sh
          bash -n deploy/proxy-entry/configure-firewall.sh
          bash -n deploy/proxy-entry/check-ports.sh
          cargo build -p proxy-entry --release

      - name: Package Entry release
        env:
          ENTRY_ID: ${{ vars[format('{0}_ID', inputs.environment)] }}
          ADVERTISED_ADDRESS: ${{ vars[format('{0}_ADVERTISED_ADDRESS', inputs.environment)] }}
          REGISTRY_URL: ${{ vars[format('{0}_REGISTRY_URL', inputs.environment)] }}
          RUNTIME_ROOT: ${{ vars[format('{0}_RUNTIME_ROOT', inputs.environment)] }}
          CONTROL_TOKEN: ${{ secrets[format('{0}_CONTROL_TOKEN', inputs.environment)] }}
          INSTANCE_COUNT: ${{ inputs.instance_count }}
        run: |
          set -euo pipefail
          source deploy/proxy-entry/instance-layout.sh
          : "${ENTRY_ID:?${{ inputs.environment }}_ID is required}"
          : "${ADVERTISED_ADDRESS:?${{ inputs.environment }}_ADVERTISED_ADDRESS is required}"
          : "${REGISTRY_URL:?${{ inputs.environment }}_REGISTRY_URL is required}"
          : "${CONTROL_TOKEN:?${{ inputs.environment }}_CONTROL_TOKEN is required}"
          validate_instance_count "$INSTANCE_COUNT"
          validate_entry_id_for_instances "$ENTRY_ID" "$INSTANCE_COUNT"
          validate_advertised_address "$ADVERTISED_ADDRESS"
          bash deploy/proxy-entry/validate-registry-url.sh "$REGISTRY_URL"
          [ "${#CONTROL_TOKEN}" -ge 32 ]
          case "$CONTROL_TOKEN" in *[[:space:]]*) exit 1 ;; esac

          bundle=".deploy/proxy-entry"
          mkdir -p "$bundle"
          install -m 0755 target/release/proxy-entry "$bundle/proxy-entry"
          install -m 0755 deploy/proxy-entry/install.sh "$bundle/install.sh"
          install -m 0755 deploy/proxy-entry/validate-registry-url.sh \
            "$bundle/validate-registry-url.sh"
          install -m 0755 deploy/proxy-entry/instance-layout.sh \
            "$bundle/instance-layout.sh"
          install -m 0755 deploy/proxy-entry/configure-firewall.sh \
            "$bundle/configure-firewall.sh"
          install -m 0755 deploy/proxy-entry/check-ports.sh \
            "$bundle/check-ports.sh"
          cp config/proxy-entry.toml "$bundle/proxy-entry.toml"
          printf '%s' "$CONTROL_TOKEN" >"$bundle/control-token"
          {
            printf 'RELEASE_SHA=%q\n' "$GITHUB_SHA"
            printf 'ENTRY_ID=%q\n' "$ENTRY_ID"
            printf 'ADVERTISED_ADDRESS=%q\n' "$ADVERTISED_ADDRESS"
            printf 'REGISTRY_URL=%q\n' "$REGISTRY_URL"
            printf 'RUNTIME_ROOT=%q\n' "${RUNTIME_ROOT:-/opt/ppaass-entry}"
            printf 'INSTANCE_COUNT=%q\n' "$INSTANCE_COUNT"
          } >"$bundle/deploy.env"
          tar -C .deploy -czf .deploy/proxy-entry.tgz proxy-entry

      - name: Resolve Entry host
        env:
          REMOTE_HOST: ${{ secrets[format('{0}_REMOTE_HOST', inputs.environment)] }}
          REMOTE_USER: ${{ secrets[format('{0}_REMOTE_USER', inputs.environment)] }}
          REMOTE_PASSWORD: ${{ secrets[format('{0}_REMOTE_PASSWORD', inputs.environment)] }}
        run: |
          set -euo pipefail
          : "${REMOTE_HOST:?${{ inputs.environment }}_REMOTE_HOST is required}"
          : "${REMOTE_USER:?${{ inputs.environment }}_REMOTE_USER is required}"
          : "${REMOTE_PASSWORD:?${{ inputs.environment }}_REMOTE_PASSWORD is required}"
          case "$REMOTE_HOST" in *[!0-9A-Za-z._-]*|'') exit 1 ;; esac
          case "$REMOTE_USER" in *[!0-9A-Za-z._-]*|'') exit 1 ;; esac
          case "$REMOTE_PASSWORD" in *$'\n'*|*$'\r'*) exit 1 ;; esac
          {
            printf 'REMOTE_HOST=%s\n' "$REMOTE_HOST"
            printf 'REMOTE_USER=%s\n' "$REMOTE_USER"
            printf 'REMOTE_PASSWORD=%s\n' "$REMOTE_PASSWORD"
          } >>"$GITHUB_ENV"

      - name: Deploy Entry data plane
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass
          export SSHPASS="$REMOTE_PASSWORD"
          remote_root="/tmp/ppaass-entry-$GITHUB_SHA"
          ssh_options=(
            -o PubkeyAuthentication=no
            -o PreferredAuthentications=password
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$RUNNER_TEMP/ppaass-deploy-known-hosts"
          )
          sshpass -e ssh "${ssh_options[@]}" "$REMOTE_USER@$REMOTE_HOST" \
            "install -d -m 0700 '$remote_root'"
          sshpass -e scp "${ssh_options[@]}" .deploy/proxy-entry.tgz \
            "$REMOTE_USER@$REMOTE_HOST:$remote_root/release.tgz"
          sshpass -e ssh "${ssh_options[@]}" "$REMOTE_USER@$REMOTE_HOST" \
            "tar -xzf '$remote_root/release.tgz' -C '$remote_root' && \
             bash '$remote_root/proxy-entry/install.sh' '$remote_root/proxy-entry'; \
             status=\$?; rm -rf -- '$remote_root'; exit \$status"
