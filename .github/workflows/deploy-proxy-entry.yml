name: Build and Deploy Proxy Entry

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select environment
        required: true
        type: choice
        options: [production, dev, qa]

permissions:
  contents: read

concurrency:
  group: deploy-proxy-entry-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Test and build Entry
        run: |
          set -euo pipefail
          bash scripts/check-source-line-limits.sh
          bash scripts/test-proxy-deployment-layout.sh
          bash -n deploy/proxy-entry/install.sh
          cargo test -p proxy-control-protocol -p proxy-entry
          cargo build -p proxy-entry --release

      - name: Package Entry release
        env:
          ENTRY_ID: ${{ vars.PPAASS_PROXY_ENTRY_ID }}
          CONTROL_HOST: ${{ vars.PPAASS_REGISTRY_CONTROL_PUBLIC_HOST }}
          RUNTIME_ROOT: ${{ vars.PPAASS_ENTRY_RUNTIME_ROOT }}
          CONTROL_TOKEN: ${{ secrets.PPAASS_PROXY_CONTROL_TOKEN }}
          IDENTITY_PRIVATE_KEY: ${{ secrets.PPAASS_PROXY_IDENTITY_PRIVATE_KEY_PEM }}
          IDENTITY_PUBLIC_KEY: ${{ secrets.PPAASS_PROXY_IDENTITY_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          : "${ENTRY_ID:?PPAASS_PROXY_ENTRY_ID is required}"
          : "${CONTROL_HOST:?PPAASS_REGISTRY_CONTROL_PUBLIC_HOST is required}"
          : "${CONTROL_TOKEN:?PPAASS_PROXY_CONTROL_TOKEN is required}"
          : "${IDENTITY_PRIVATE_KEY:?PPAASS_PROXY_IDENTITY_PRIVATE_KEY_PEM is required}"
          : "${IDENTITY_PUBLIC_KEY:?PPAASS_PROXY_IDENTITY_PUBLIC_KEY_PEM is required}"
          case "$ENTRY_ID" in *[!0-9A-Za-z._:-]*|'') exit 1 ;; esac
          case "$CONTROL_HOST" in *[!0-9A-Za-z._-]*|'') exit 1 ;; esac
          [ "${#CONTROL_TOKEN}" -ge 32 ]
          case "$CONTROL_TOKEN" in *[[:space:]]*) exit 1 ;; esac

          bundle=".deploy/proxy-entry"
          mkdir -p "$bundle"
          install -m 0755 target/release/proxy-entry "$bundle/proxy-entry"
          install -m 0755 deploy/proxy-entry/install.sh "$bundle/install.sh"
          cp config/remote/proxy-entry.toml "$bundle/proxy-entry.toml"
          printf '%s' "$CONTROL_TOKEN" >"$bundle/control-token"
          printf '%s\n' "$IDENTITY_PRIVATE_KEY" >"$bundle/proxy-identity-private.pem"
          printf '%s\n' "$IDENTITY_PUBLIC_KEY" >"$bundle/expected-public.pem"
          openssl pkey -in "$bundle/proxy-identity-private.pem" -pubout \
            -out "$bundle/derived-public.pem"
          openssl pkey -pubin -in "$bundle/expected-public.pem" -outform DER \
            -out "$bundle/expected-public.der"
          openssl pkey -pubin -in "$bundle/derived-public.pem" -outform DER \
            -out "$bundle/derived-public.der"
          cmp "$bundle/expected-public.der" "$bundle/derived-public.der"
          rm "$bundle/"*-public.*
          {
            printf 'RELEASE_SHA=%q\n' "$GITHUB_SHA"
            printf 'ENTRY_ID=%q\n' "$ENTRY_ID"
            printf 'CONTROL_URL=%q\n' "https://$CONTROL_HOST"
            printf 'RUNTIME_ROOT=%q\n' "${RUNTIME_ROOT:-/opt/ppaass-entry}"
          } >"$bundle/deploy.env"
          tar -C .deploy -czf .deploy/proxy-entry.tgz proxy-entry

      - name: Resolve Entry host
        env:
          PROD_HOST: ${{ secrets.PRODUCTION_ENTRY_REMOTE_HOST }}
          PROD_USER: ${{ secrets.PRODUCTION_ENTRY_REMOTE_USER }}
          PROD_PASSWORD: ${{ secrets.PRODUCTION_ENTRY_REMOTE_PASSWORD }}
          DEV_HOST: ${{ secrets.DEV_ENTRY_REMOTE_HOST }}
          DEV_USER: ${{ secrets.DEV_ENTRY_REMOTE_USER }}
          DEV_PASSWORD: ${{ secrets.DEV_ENTRY_REMOTE_PASSWORD }}
          QA_HOST: ${{ secrets.QA_ENTRY_REMOTE_HOST }}
          QA_USER: ${{ secrets.QA_ENTRY_REMOTE_USER }}
          QA_PASSWORD: ${{ secrets.QA_ENTRY_REMOTE_PASSWORD }}
          KNOWN_HOSTS: ${{ secrets.PPAASS_DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          case "${{ inputs.environment }}" in
            production) host="$PROD_HOST"; user="$PROD_USER"; password="$PROD_PASSWORD" ;;
            dev) host="$DEV_HOST"; user="$DEV_USER"; password="$DEV_PASSWORD" ;;
            qa) host="$QA_HOST"; user="$QA_USER"; password="$QA_PASSWORD" ;;
          esac
          : "${host:?Entry remote host is required}"
          : "${user:?Entry remote user is required}"
          : "${password:?Entry remote password is required}"
          : "${KNOWN_HOSTS:?PPAASS_DEPLOY_SSH_KNOWN_HOSTS is required}"
          case "$host" in *[!0-9A-Za-z._-]*|'') exit 1 ;; esac
          case "$user" in *[!0-9A-Za-z._-]*|'') exit 1 ;; esac
          case "$password" in *$'\n'*|*$'\r'*) exit 1 ;; esac
          {
            printf 'REMOTE_HOST=%s\n' "$host"
            printf 'REMOTE_USER=%s\n' "$user"
            printf 'REMOTE_PASSWORD<<PPAASS_EOF\n%s\nPPAASS_EOF\n' "$password"
          } >>"$GITHUB_ENV"
          mkdir -p ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Deploy Entry data plane
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass
          export SSHPASS="$REMOTE_PASSWORD"
          remote_root="/tmp/ppaass-entry-$GITHUB_SHA"
          ssh_options=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          sshpass -e ssh "${ssh_options[@]}" "$REMOTE_USER@$REMOTE_HOST" \
            "install -d -m 0700 '$remote_root'"
          sshpass -e scp "${ssh_options[@]}" .deploy/proxy-entry.tgz \
            "$REMOTE_USER@$REMOTE_HOST:$remote_root/release.tgz"
          sshpass -e ssh "${ssh_options[@]}" "$REMOTE_USER@$REMOTE_HOST" \
            "tar -xzf '$remote_root/release.tgz' -C '$remote_root' && \
             bash '$remote_root/proxy-entry/install.sh' '$remote_root/proxy-entry'; \
             status=\$?; rm -rf -- '$remote_root'; exit \$status"
