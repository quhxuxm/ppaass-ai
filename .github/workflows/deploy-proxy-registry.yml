name: Build and Deploy Proxy Registry

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select environment
        required: true
        type: choice
        options: [registry_production]

permissions:
  contents: read

concurrency:
  group: deploy-proxy-registry-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: proxy-registry/frontend/package-lock.json

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Validate deployment scripts
        run: |
          bash -n start-proxy-registry.sh deploy/proxy-registry/install.sh

      - name: Build Registry
        run: |
          set -euo pipefail
          npm ci --prefix proxy-registry/frontend --no-audit --no-fund
          npm run build --prefix proxy-registry/frontend
          cargo build -p proxy-registry --release

      - name: Package Registry release
        env:
          REGISTRY_HOST: ${{ vars[format('{0}_REGISTRY_HOST', inputs.environment)] }}
          RUNTIME_ROOT: ${{ vars[format('{0}_RUNTIME_ROOT', inputs.environment)] }}
          ADMIN_PASSWORD: ${{ secrets[format('{0}_WEB_ADMIN_PASSWORD', inputs.environment)] }}
          REGISTRY_KEY_SECRET: ${{ secrets[format('{0}_KEY_ENCRYPTION_SECRET', inputs.environment)] }}
          CONTROL_TOKEN: ${{ secrets[format('{0}_CONTROL_TOKEN', inputs.environment)] }}
        run: |
          set -euo pipefail
          : "${REGISTRY_HOST:?${{ inputs.environment }}_REGISTRY_HOST is required}"
          : "${ADMIN_PASSWORD:?${{ inputs.environment }}_WEB_ADMIN_PASSWORD is required}"
          : "${REGISTRY_KEY_SECRET:?${{ inputs.environment }}_KEY_ENCRYPTION_SECRET is required}"
          : "${CONTROL_TOKEN:?${{ inputs.environment }}_CONTROL_TOKEN is required}"
          case "$REGISTRY_HOST" in
            *[!0-9A-Za-z._-]*) echo "Invalid Registry host name" >&2; exit 1 ;;
          esac
          [ "${#ADMIN_PASSWORD}" -ge 8 ]
          [ "${#REGISTRY_KEY_SECRET}" -ge 32 ]
          [ "${#CONTROL_TOKEN}" -ge 32 ]
          case "$CONTROL_TOKEN" in *[[:space:]]*) exit 1 ;; esac

          bundle=".deploy/proxy-registry"
          mkdir -p "$bundle/frontend"
          install -m 0755 target/release/proxy-registry "$bundle/proxy-registry"
          install -m 0755 start-proxy-registry.sh "$bundle/start-proxy-registry.sh"
          install -m 0755 deploy/proxy-registry/install.sh "$bundle/install.sh"
          cp -a proxy-registry/frontend/dist/. "$bundle/frontend/"
          printf '%s' "$ADMIN_PASSWORD" >"$bundle/admin-password"
          printf '%s' "$REGISTRY_KEY_SECRET" >"$bundle/registry-key-secret"
          printf '%s' "$CONTROL_TOKEN" >"$bundle/control-token"
          {
            printf 'RELEASE_SHA=%q\n' "$GITHUB_SHA"
            printf 'REGISTRY_HOST=%q\n' "$REGISTRY_HOST"
            printf 'RUNTIME_ROOT=%q\n' "${RUNTIME_ROOT:-/opt/ppaass-registry}"
          } >"$bundle/deploy.env"
          tar -C .deploy -czf .deploy/proxy-registry.tgz proxy-registry

      - name: Resolve Registry host
        env:
          REMOTE_HOST: ${{ secrets[format('{0}_REMOTE_HOST', inputs.environment)] }}
          REMOTE_USER: ${{ secrets[format('{0}_REMOTE_USER', inputs.environment)] }}
          REMOTE_PASSWORD: ${{ secrets[format('{0}_REMOTE_PASSWORD', inputs.environment)] }}
        run: |
          set -euo pipefail
          : "${REMOTE_HOST:?${{ inputs.environment }}_REMOTE_HOST is required}"
          : "${REMOTE_USER:?${{ inputs.environment }}_REMOTE_USER is required}"
          : "${REMOTE_PASSWORD:?${{ inputs.environment }}_REMOTE_PASSWORD is required}"
          case "$REMOTE_HOST" in *[!0-9A-Za-z._-]*|'') exit 1 ;; esac
          case "$REMOTE_USER" in *[!0-9A-Za-z._-]*|'') exit 1 ;; esac
          case "$REMOTE_PASSWORD" in *$'\n'*|*$'\r'*) exit 1 ;; esac
          {
            printf 'REMOTE_HOST=%s\n' "$REMOTE_HOST"
            printf 'REMOTE_USER=%s\n' "$REMOTE_USER"
            printf 'REMOTE_PASSWORD=%s\n' "$REMOTE_PASSWORD"
          } >>"$GITHUB_ENV"

      - name: Deploy two Registry instances and Caddy
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass
          export SSHPASS="$REMOTE_PASSWORD"
          remote_root="/tmp/ppaass-registry-$GITHUB_SHA"
          ssh_options=(
            -o PubkeyAuthentication=no
            -o PreferredAuthentications=password
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$RUNNER_TEMP/ppaass-deploy-known-hosts"
          )
          sshpass -e ssh "${ssh_options[@]}" "$REMOTE_USER@$REMOTE_HOST" \
            "install -d -m 0700 '$remote_root'"
          sshpass -e scp "${ssh_options[@]}" .deploy/proxy-registry.tgz \
            "$REMOTE_USER@$REMOTE_HOST:$remote_root/release.tgz"
          sshpass -e ssh "${ssh_options[@]}" "$REMOTE_USER@$REMOTE_HOST" \
            "tar -xzf '$remote_root/release.tgz' -C '$remote_root' && \
             bash '$remote_root/proxy-registry/install.sh' '$remote_root/proxy-registry'; \
             status=\$?; rm -rf -- '$remote_root'; exit \$status"
