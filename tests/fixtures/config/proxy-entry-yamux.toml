# Local native encrypted UDP plus full-TCP smoke-test proxy.

listen_addr = "0.0.0.0:18080"
entry_id = "entry-yamux-test"
advertised_address = "127.0.0.1:18080"
registry_url = "http://127.0.0.1:8797"
registry_control_token_path = "data/proxy-control-token"
authorization_database_path = "data/proxy-entry-yamux-authorization.sqlite3"
log_level = "info"
log_dir = "logs"
log_file = "proxy-yamux-test.log"
# 仅 framed TCP/TCP-Yamux 使用此压缩设置；原生加密 UDP 不压缩。
compression_mode = "none"
runtime_threads = 4
replay_attack_tolerance = 300
async_runtime_stack_size_mb = 2
connect_timeout_secs = 20
auth_timeout_secs = 20
tcp_relay_idle_timeout_secs = 0
tcp_relay_half_close_idle_timeout_secs = 30
yamux_session_idle_timeout_secs = 300
udp_relay_idle_timeout_secs = 60
udp_relay_channel_size = 64
udp_relay_max_flows = 256
udp_session_limit = 4096
udp_session_limit_per_username = 64
udp_session_channel_size = 256
udp_session_max_flows = 256

[yamux]
max_streams_per_session = 128
keepalive_interval_secs = 30
connection_write_timeout_secs = 300
stream_window_size_kb = 8192
