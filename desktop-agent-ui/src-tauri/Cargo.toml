[package]
name = "desktop-agent-ui"
version = "0.1.1"
description = "PPAASS Desktop Agent UI"
authors = ["PPAASS"]
license = "MIT"
repository = ""
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
common = { path = "../../common" }
desktop-agent-be = { path = "../../desktop-agent-be" }
protocol = { path = "../../protocol" }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tauri = { version = "2.11.3", features = ["image-png", "tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2.4.2"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["full", "tracing"] }
tokio-util = { version = "0.7.18", features = ["codec", "io"] }
toml = "1.1.2"
toml_edit = "0.25.12"
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5"
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
getrandom = "0.3.4"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell"] }
windows-service = "0.8.1"
