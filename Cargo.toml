[workspace]
members = [
    "desktop-agent-be",
    "proxy-entry",
    "proxy-control-protocol",
    "proxy-registry",
    "common",
    "protocol",
    "tests",
    "android-agent/native",
]
resolver = "2"

# Favor runtime throughput for distributable binaries. These settings make
# release builds slower, but allow LLVM to optimize across crate boundaries
# and consider the complete program as a single optimization unit.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Keep performance measurements representative of production binaries.
[profile.bench]
inherits = "release"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["PPAASS Team"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["full", "tracing"] }
tokio-yamux = "0.3.20"
tokio-util = { version = "0.7.19", features = ["codec", "io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
bitcode = { version = "0.6.9", features = ["serde"] }
config = "0.15.25"
# clap 4.6.x pulls proc-macro2 1.0.106+, which conflicts with tun-rs 2.8.x's
# Windows c2rust-bitfields proc-macro pins. Keep the newest compatible release.
clap = { version = "=4.5.55", features = ["derive"] }
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"
thiserror = "2.0.20"
anyhow = "1.0.104"
bytes = "1.12.1"
fast-socks5 = "1.0.0"
hyper = { version = "1.11.0", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
http-body-util = "0.1.5"
deadpool = "0.13.0"
toml = "1.1.2"
time = { version = "0.3.55", features = ["parsing"] }
rsa = { version = "0.9.10", features = ["sha2"] }
aes-gcm = "0.11.0"
ring = "0.17.14"
rand = "0.10.2"
sha2 = "0.11.0"
hkdf = "0.13.0"
base64 = "0.23.1"
async-trait = "0.1.92"
parking_lot = "0.12.5"
arc-swap = "1.9.2"
dashmap = "6.2.1"
zstd = "0.13.3"
lz4_flex = "0.14.0"
flate2 = "1.1.9"
mimalloc = "0.1.52"
futures = "0.3.34"
hex = "0.4.3"
pretty-hex = "0.4.2"
hickory-proto = { version = "0.26.1", default-features = false, features = [
    "std",
] }
ratatui = "0.30.2"
crossterm = "0.29.0"
hdrhistogram = "7.6.0"
sysinfo = "0.39.6"
async-socks5 = "0.6.0"
jni = "0.22.4"
tun-rs = { version = "2.8.8", features = ["async_tokio"] }
netstack-smoltcp = "0.2.4"
route_manager = "0.2.13"
socket2 = { version = "0.6.5", features = ["all"] }
if-addrs = "0.15.0"
nix = { version = "0.31.3", default-features = false, features = [
    "socket",
    "uio",
] }
libc = "0.2.186"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_UI_Shell",
] }
tempfile = "3.27.0"
axum = "0.8.9"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "timeout", "trace"] }
argon2 = "0.5"
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "rustls",
] }
url = "2.5.8"
zeroize = "1.9.0"
